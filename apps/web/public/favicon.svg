<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64">
  <defs>
    <linearGradient id="shieldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f2942" />
      <stop offset="100%" stop-color="#071726" />
    </linearGradient>
    <linearGradient id="goldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#f59e0b" />
      <stop offset="50%" stop-color="#fbbf24" />
      <stop offset="100%" stop-color="#d97706" />
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="1" stdDeviation="1.5" flood-color="#000000" flood-opacity="0.4" />
    </filter>
  </defs>

  <!-- Outer Circle Shield -->
  <circle cx="32" cy="32" r="30" fill="url(#shieldGrad)" stroke="url(#goldGrad)" stroke-width="2.5" filter="url(#glow)" />

  <!-- Inner Decorative Ring -->
  <circle cx="32" cy="32" r="26" fill="none" stroke="#c99a3e" stroke-width="0.8" stroke-dasharray="3,2" opacity="0.7" />

  <!-- Government Pillars / Ashoka Capitol Silhouette -->
  <!-- Base Pedestal -->
  <rect x="20" y="44" width="24" height="3" rx="1" fill="url(#goldGrad)" />
  <rect x="23" y="41" width="18" height="2" rx="0.5" fill="url(#goldGrad)" />

  <!-- Open Knowledge Book / Rules Codex -->
  <path d="M 21 34 Q 32 30 32 38 Q 32 30 43 34 L 43 40 Q 32 36 32 40 Q 32 36 21 40 Z" fill="#ffffff" opacity="0.95" />
  <path d="M 32 34 L 32 40" stroke="#0f2942" stroke-width="1.2" stroke-linecap="round" />

  <!-- Verification Quill & AI Spark / Star of Wisdom -->
  <path d="M 32 14 L 33.8 19.5 L 39.5 20.2 L 35 24 L 36.5 29.5 L 32 26.2 L 27.5 29.5 L 29 24 L 24.5 20.2 L 30.2 19.5 Z" fill="url(#goldGrad)" />
  <circle cx="32" cy="23" r="2" fill="#ffffff" />

  <!-- Trust Shield Check / Provenance Icon -->
  <circle cx="44" cy="22" r="5" fill="#10b981" stroke="#ffffff" stroke-width="1.2" />
  <path d="M 42 22 L 43.5 23.5 L 46.5 20.5" fill="none" stroke="#ffffff" stroke-width="1.2" stroke-linecap="round" stroke-linejoin="round" />
</svg>
